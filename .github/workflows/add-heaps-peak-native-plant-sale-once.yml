name: Add Heaps Peak native plant sale once

on:
  push:
    paths:
      - .github/workflows/add-heaps-peak-native-plant-sale-once.yml

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add event to source data
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("data/events.json")
          text = path.read_text(encoding="utf-8")
          data = json.loads(text)

          event = {
              "id": "heaps-peak-fall-native-plant-sale-2026",
              "title": "Heaps Peak Arboretum Fall Native Plant Sale",
              "status": "confirmed",
              "start": "2026-09-26T09:00",
              "end": "2026-09-26T12:00",
              "location": {
                  "name": "Heaps Peak Arboretum",
                  "address": "29358 Rim of the World Hwy 18, Skyforest, CA 92385"
              },
              "pricing": [
                  "Free admission to the Arboretum; plants sold separately",
                  "Parking is free on September 26 for National Public Lands Day"
              ],
              "summary": "Heaps Peak’s fall sale focuses on native and mountain-adapted plants suited to local high-elevation gardens, with the organizer urging shoppers to arrive early for the best selection.",
              "schedule": [
                  "9:00 AM–12:00 PM — Fall Native Plant Sale; come early for the best selection"
              ],
              "details": [
                  "Heaps Peak says its plant sales emphasize native plants, with some non-native plants included when they grow well at elevations of 4,000 feet or higher",
                  "Members receive 20% off plant-sale purchases; to receive the 2026 fall-sale discount, join by September 17"
              ],
              "tips": [
                  "Come near opening for the strongest selection",
                  "No Adventure Pass is needed for Arboretum parking on September 26 because it is National Public Lands Day"
              ],
              "conflicts": [
                  "green-thumbs-forest-restoration-2026-09-26"
              ],
              "sources": [
                  {
                      "label": "Heaps Peak Arboretum official events calendar",
                      "url": "https://hparboretum.com/calendar/"
                  },
                  {
                      "label": "Heaps Peak Arboretum parking and free-parking dates",
                      "url": "https://hparboretum.com/parking-and-directions/"
                  },
                  {
                      "label": "Lake Arrowhead Communities Chamber event calendar",
                      "url": "https://lakearrowheadcommunitieschamberofcommerce.growthzoneapp.com/entertainmentcalendar"
                  }
              ],
              "categories": ["Plants", "Native Plants", "Garden", "Outdoors"],
              "last_verified": "2026-09-16",
              "last_modified": "2026-09-16T21:00:00Z",
              "sequence": 0
          }

          if any(item.get("id") == event["id"] for item in data["events"]):
              raise SystemExit(f"{event['id']} already exists; refusing to create a duplicate")

          text, count = re.subn(
              r'("last_updated": ")\d{4}-\d{2}-\d{2}(")',
              r'\g<1>2026-09-16\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update calendar.last_updated exactly once")

          tail = "\n    }\n  ]\n}\n"
          if not text.endswith(tail):
              raise SystemExit("events.json has an unexpected tail; refusing unsafe edit")

          event_block = "\n".join("    " + line for line in json.dumps(event, ensure_ascii=False, indent=2).splitlines())
          text = text[:-len(tail)] + "\n    },\n" + event_block + "\n  ]\n}\n"

          # Parse the result before writing so malformed JSON never reaches the repo.
          json.loads(text)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate and validate feed
        run: |
          python3 scripts/generate_calendar.py
          python3 scripts/validate_calendar.py
          python3 -m unittest discover -s tests -v

      - name: Commit calendar update and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/add-heaps-peak-native-plant-sale-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Heaps Peak fall native plant sale"
          git push
