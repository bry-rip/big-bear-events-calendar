name: Validate calendar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate feed
        run: python3 scripts/generate_calendar.py
      - name: Validate feed
        run: python3 scripts/validate_calendar.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Confirm generated feed is committed
        run: git diff --exit-code -- public/big-bear-events.ics
