name: Validate calendar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate feed
        run: python3 scripts/generate_calendar.py
      - name: Validate feed
        run: python3 scripts/validate_calendar.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify changed events carry update revisions
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_updates.py "$BASE_REVISION"
      - name: Print KOTM block for feed debugging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("public/big-bear-events.ics").read_text(encoding="utf-8")
          uid = "UID:king-of-the-mountain-2-superfights-2026@big-bear-events.bry.rip"
          pos = s.index(uid)
          start = s.rfind("BEGIN:VEVENT", 0, pos)
          end = s.index("END:VEVENT", pos) + len("END:VEVENT")
          print("KOTM_BLOCK_START")
          print(s[start:end])
          print("KOTM_BLOCK_END")
          PY
      - name: Confirm generated feed is committed
        run: git diff --exit-code -- public/big-bear-events.ics
