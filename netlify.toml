[build]
  command = "python3 scripts/generate_calendar.py && python3 scripts/validate_calendar.py"
  publish = "public"

[[headers]]
  for = "/big-bear-events.ics"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"
    Content-Disposition = "inline; filename=\"big-bear-events.ics\""
    Content-Type = "text/calendar; charset=utf-8"

[[redirects]]
  from = "/calendar.ics"
  to = "/big-bear-events.ics"
  status = 301
